name = "nexus-ai-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
# Replace with your HostGator Laravel API domain (no trailing slash)
LARAVEL_API_URL = "https://api.yourdomain.com"

# OpenRouter chat configuration (legacy OLLAMA_* variable names are retained)
OLLAMA_API_URL = "https://openrouter.ai/api/v1/chat/completions"
OLLAMA_MODEL = "qwen/qwen3-vl-30b-a3b-instruct"

# Secret (Set using `npx wrangler secret put OLLAMA_API_KEY` or in Cloudflare Dashboard Variables)
# OLLAMA_API_KEY = "your_openrouter_api_key_here"
